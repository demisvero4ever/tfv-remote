name: TFV Remote - compilar

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la publicación donde se suben los instaladores"
        required: true
        default: "tfv-1.5.0"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.tag }}
